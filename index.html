<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game-Free Growth</title>
<style>
:root{--bg:#f1f8f9;--card:#fff;--tx:#12303a;--mu:#5d7882;--pr:#2563eb;--gr:#10b981;--bd:#d9e8ec;--soft:#e8f3f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1f26;--card:#14303a;--tx:#e8f6f8;--mu:#93b2bb;--bd:#24474f;--soft:#1b3b45}}
:root[data-theme="dark"]{--bg:#0d1f26;--card:#14303a;--tx:#e8f6f8;--mu:#93b2bb;--bd:#24474f;--soft:#1b3b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h2,h3,p{margin:0}h2{font-size:21px}h3{font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--pr),var(--gr));color:#fff;border:0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.mu{color:var(--mu);font-size:14px}
button,select{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;min-height:48px;background:var(--soft);color:var(--tx);font-weight:600}
button.p{background:linear-gradient(135deg,var(--pr),var(--gr));color:#fff}button.w{background:#fff;color:var(--pr)}
button.big{width:100%;font-size:18px;min-height:56px}button.on{background:var(--pr);color:#fff}button:disabled{opacity:.5}
input,textarea,select{font:inherit;width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px}
.prog{height:12px;background:var(--soft);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--gr));border-radius:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:10px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11px;color:var(--mu)}
.bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--gr),var(--pr))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}
.opt{width:100%;text-align:left;margin-top:8px}.opt.on{background:var(--pr);color:#fff}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:var(--soft);font-size:13px}.badge span{font-size:30px;display:block}.badge.lock{opacity:.4;filter:grayscale(1)}
.item{padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:560px;margin:auto}nav button{flex:1;background:none;font-size:11px;padding:6px 0;color:var(--mu)}nav button b{display:block;font-size:21px;font-weight:400}nav button.on{color:var(--pr);background:var(--soft)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--pr);color:#fff;padding:12px 18px;border-radius:14px;z-index:9;max-width:90%;text-align:center}
.center{min-height:85vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:16px}
</style></head><body><div id="app"></div><nav id="nav" hidden><div></div></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=()=>new Date().toLocaleDateString('en-CA'),DAY=864e5;
const S0=[["General Knowledge","What is the capital of Australia?",["Sydney","Canberra","Melbourne","Perth"],1],["Science","Which gas do plants absorb for photosynthesis?",["Oxygen","Carbon dioxide","Nitrogen","Helium"],1],["Technology","Which of these is an operating system?",["Android","Gmail","Excel","Google Docs"],0],["Computer Science","Binary 101 equals which decimal number?",["3","5","6","7"],1],["English","Choose the antonym of 'ancient'.",["Old","Modern","Historic","Aged"],1],["Mathematics","What is 12 × 12?",["124","144","134","154"],1],["Current Affairs","Which organisation leads global health efforts?",["WHO","FIFA","NASA","IMF"],0],["Logical Reasoning","Next number: 2, 4, 8, 16, ?",["24","30","32","34"],2],["Science","Water boils at sea level at what temperature (°C)?",["90","100","110","120"],1],["Mathematics","What is 25% of 200?",["25","50","75","100"],1]];
const STARTER={id:'starter',title:'Starter Test',order:0,questions:S0.map(a=>({s:a[0],q:a[1],o:a[2],a:a[3]}))};
const ACTS=[["read","📖","5-minute reading","Read any article, chapter or blog for 5 minutes. Then write one sentence about what you learned."],["vocab","🔤","Vocabulary","Word: 'persevere' — to keep trying despite difficulty. Use it in a sentence today."],["gk","🌍","General knowledge","Honey never spoils; edible honey has been found in ancient tombs."],["code","💻","Coding basics","A variable stores a value: score = 10. A loop repeats actions, like 'for i in range(3)'."],["puz","🧩","Brain puzzle","I have keys but open no doors, and space but no room. What am I?","A keyboard."],["math","➗","Mathematics","Quick: what is 15% of 80?","12"],["sci","🔬","Science fact","Lightning is about five times hotter than the surface of the Sun."]];
const HAB=[["gaming","🎮","Gaming"],["study","📚","Studying"],["exercise","🏃","Exercise"],["reading","📖","Reading"],["free","🌿","Screen-free"]];
const ENC=["You don't have to quit everything at once. Build better habits one week at a time.","Small steps every week create big changes.","Balance is a skill — and you're practising it.","Every minute you invest in yourself counts."];
const BADGES=[["🌱","First Week",p=>p.results.length>=1],["📚","Knowledge Builder",p=>p.pts>=300],["🔥","4 Week Streak",p=>p.streak>=4],["🏆","10 Week Champion",p=>p.results.length>=10]];
let user=null,db=null,me=null,uid=null,P=null,tests=[],isAdmin=false,view='login',T=null,last=null,busy=0,adm={tab:'q',tid:null,edit:null,users:null},rd=0,shown={};
const blank=()=>({name:'',email:'',pts:0,streak:0,results:[],habits:{},learned:{}});
function toast(m){const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2800)}
async function save(p){try{if(db&&uid)await db.collection('users').doc(uid).set(Object.assign({},p,{uid,updated:new Date().toISOString()}));else localStorage.setItem('gfg',JSON.stringify(p));return true}catch(e){return false}}
async function upd(fn,msg){const n=structuredClone(P);fn(n);if(await save(n)){P=n;if(msg)toast(msg)}else toast('Could not save — please try again');render()}
async function init(){try{if(window.claude){user=await claude.use('user');db=await claude.use('db')}}catch(e){}
try{if(user){me=await user.me();if(db&&me.id){uid=me.id;isAdmin=await user.canEdit()}}}catch(e){db=null}
render()}
async function enter(){P=blank();
if(db&&uid){try{const s=await db.collection('users').doc(uid).get();if(s.exists)P=Object.assign(blank(),s.data())}catch(e){}}else{try{P=Object.assign(blank(),JSON.parse(localStorage.getItem('gfg')))}catch(e){}}
if(!P.name)P.name=(me&&me.name)||'Friend';if(me&&me.email)P.email=me.email;
await loadTests();view='home';render()}
async function loadTests(){tests=[];if(db){try{const q=await db.collection('tests').get();tests=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.order||0)-(b.order||0))}catch(e){}}
tests=tests.filter(t=>t.questions&&t.questions.length);if(!tests.length)tests=[STARTER]}
const unlockAt=()=>P.results.length?new Date(P.results.at(-1).date).getTime()+7*DAY:0;
const open=()=>Date.now()>=unlockAt(),curTest=()=>tests[P.results.length%tests.length];
function left(){const m=unlockAt()-Date.now(),d=Math.floor(m/DAY),h=Math.ceil(m%DAY/36e5);return d+'d '+h+'h'}
const wk=()=>P.results.filter(r=>Date.now()-new Date(r.date)<7*DAY);
const lastN=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d.toLocaleDateString('en-CA')});
const learnedWeek=()=>lastN(7).reduce((a,k)=>a+(P.learned[k]||[]).length,0);
/* test flow */
function startTest(){if(!open())return;T={t:curTest(),i:0,a:[],sel:null};view='test';render()}
function pick(j){T.sel=j;render()}
function nextQ(){T.a[T.i]=T.sel;T.sel=null;T.i++;T.i>=T.t.questions.length?finish():render()}
async function finish(){if(busy)return;busy=1;view='saving';render();
try{if(db&&uid){const s=await db.collection('users').doc(uid).get();if(s.exists&&(s.data().results||[]).length>P.results.length){P=Object.assign(blank(),s.data());busy=0;view='home';toast("This week's test was already completed on another device.");render();return}}}catch(e){}
const qs=T.t.questions,c=qs.filter((q,i)=>T.a[i]===q.a).length,pts=c*10+20,now=new Date(),prev=P.results.at(-1);
const res={week:P.results.length+1,testId:T.t.id,title:T.t.title,total:qs.length,correct:c,wrong:qs.length-c,pct:Math.round(c/qs.length*100),pts,date:now.toISOString(),answers:T.a};
const n=structuredClone(P);n.results.push(res);n.pts+=pts;n.streak=prev&&now-new Date(prev.date)<=14*DAY?(P.streak||0)+1:1;
const ok=await save(n);busy=0;if(ok){P=n;last=res;view='result'}else{last=res;view='fail';window._pend=n}render()}
async function retry(){if(await save(window._pend)){P=window._pend;view='result'}else toast('Still could not save');render()}
/* learn/habits */
function done(id){const k=dk();if((P.learned[k]||[]).includes(id))return;upd(n=>{(n.learned[k]=n.learned[k]||[]).push(id);n.pts+=5},'+5 points — nice work!')}
function showAns(id){shown[id]=1;render()}
function saveHabits(){upd(n=>{n.habits[dk()]=Object.fromEntries(HAB.map(h=>[h[0],Math.max(0,parseInt($('#h_'+h[0]).value)||0)]))},'Habits saved 🌿')}
function rename(){const v=$('#nm').value.trim();if(v)upd(n=>{n.name=v},'Profile updated')}
const avg=(h,from,to)=>{const ks=lastN(to).slice(0,to-from);return Math.round(ks.reduce((a,k)=>a+((P.habits[k]||{})[h]||0),0)/7)};
/* views */
const bars=a=>`<div class="bars">${a.map(x=>`<div class="bc"><b>${x[1]}</b><div class="bar" style="height:${Math.round(x[1]/Math.max(...a.map(y=>y[1]),1)*90)+4}px"></div>${x[0]}</div>`).join('')}</div>`;
const banner=()=>`<div class="card" style="border-left:5px solid var(--gr)">🔔 ${open()?'Your new knowledge test is ready! Take 5 minutes to challenge yourself.':ENC[new Date().getDate()%ENC.length]}</div>`;
function home(){const l=P.results.at(-1),wp=Math.min(100,(wk().length?50:0)+Math.min(50,learnedWeek()*10));
return`<div class="card hero"><p style="opacity:.85">Welcome back,</p><h2>${esc(P.name)} 👋</h2><p style="margin-top:8px">“Small steps every week create big changes.”</p></div>${banner()}
<div class="grid" style="margin-bottom:14px"><div class="stat">📝<b>${l?l.pts:'—'}</b><span class="mu">Latest week's score</span></div><div class="stat">⭐<b>${P.pts}</b><span class="mu">Total points</span></div><div class="stat">✅<b>${P.results.length}</b><span class="mu">Tests completed</span></div><div class="stat">🔥<b>${P.streak||0}</b><span class="mu">Week streak</span></div></div>
<div class="card"><div class="row sp"><h3>This week's progress</h3><b>${wp}%</b></div><div class="prog" style="margin:10px 0"><i style="width:${wp}%"></i></div><p class="mu">Weekly test (50%) + learning activities (10% each, up to 5).</p></div>
<button class="p big" onclick="view='${open()?'test':'learn'}';render()">${open()?'Go to this week\'s test':'Do a learning activity'}</button>`}
function learn(){const k=dk(),d=P.learned[k]||[];return`<h2 style="margin-bottom:4px">Daily learning</h2><p class="mu" style="margin-bottom:12px">Optional and quick. +5 points each. ${d.length}/7 done today.</p>`+ACTS.map(a=>`<div class="card"><h3>${a[1]} ${a[2]}</h3><p style="margin:8px 0">${a[3]}</p>${a[4]?(shown[a[0]]?`<p class="mu" style="margin-bottom:8px">Answer: <b>${a[4]}</b></p>`:`<button onclick="showAns('${a[0]}')" style="margin-bottom:8px">Show answer</button>`):''}<button class="${d.includes(a[0])?'':'p'}" ${d.includes(a[0])?'disabled':''} onclick="done('${a[0]}')" style="width:100%">${d.includes(a[0])?'✓ Completed':'Mark complete'}</button></div>`).join('')}
function test(){if(!open())return`<h2>Weekly test</h2><div class="card center" style="min-height:0;margin-top:12px"><div style="font-size:48px">🔒</div><h3>Next test unlocks in ${left()}</h3><p class="mu">You've completed this week's test. Rest, learn something small, and come back — one official test per week keeps it calm.</p></div>`+banner();
const t=curTest();return`<h2>Week ${P.results.length+1} test</h2><div class="card" style="margin-top:12px"><h3>${esc(t.title)}</h3><p class="mu" style="margin:6px 0 14px">${t.questions.length} multiple-choice questions · +10 per correct answer · +20 for completing. You can only submit this test once this week.</p><button class="p big" onclick="startTest()">Start test</button></div>`}
function quiz(){const q=T.t.questions[T.i],n=T.t.questions.length;return`<div class="row sp"><b>Question ${T.i+1} of ${n}</b><span class="mu">${esc(q.s||'')}</span></div><div class="prog" style="margin:10px 0"><i style="width:${T.i/n*100}%"></i></div><div class="card"><h3 style="font-size:18px">${esc(q.q)}</h3>${q.o.map((o,j)=>`<button class="opt ${T.sel===j?'on':''}" onclick="pick(${j})">${esc(o)}</button>`).join('')}</div><button class="p big" ${T.sel==null?'disabled':''} onclick="nextQ()">${T.i==n-1?'Finish test':'Next'}</button>`}
function result(){const r=last;return`<div class="card hero center" style="min-height:0"><div style="font-size:48px">🎉</div><h2>Test complete!</h2><p>Well done for showing up this week.</p></div><div class="grid" style="margin-bottom:14px"><div class="stat"><b>${r.correct}/${r.total}</b>Score</div><div class="stat"><b>${r.pct}%</b>Percentage</div><div class="stat"><b>${r.correct}</b>Correct</div><div class="stat"><b>${r.wrong}</b>Wrong</div></div><div class="card"><b>+${r.pts} points this week</b><p class="mu">${r.correct}×10 for correct answers + 20 completion bonus. Your next test unlocks in 7 days.</p></div><button class="p big" onclick="view='progress';render()">See progress history</button>`}
function progress(){const h=P.habits[dk()]||{},hist=P.results.slice(-10).map(r=>['W'+r.week,r.pts]),g1=avg('gaming',0,7),g0=(()=>{const ks=lastN(14).slice(0,7);return Math.round(ks.reduce((a,k)=>a+((P.habits[k]||{}).gaming||0),0)/7)})();
return`<h2>My progress</h2><div class="card hero" style="margin-top:12px"><b>⭐ ${P.pts} total points</b><p>${P.results.length} tests · ${P.streak||0}-week streak</p></div>
<div class="card"><h3>Weekly performance</h3>${hist.length?bars(hist):'<p class="mu" style="margin-top:8px">Complete your first weekly test to see your chart.</p>'}${P.results.slice().reverse().map(r=>`<div class="item row sp"><span>Week ${r.week} · ${new Date(r.date).toLocaleDateString()}</span><b>${r.pts} pts (${r.correct}/${r.total})</b></div>`).join('')}</div>
<div class="card"><h3>Today's healthy habits (minutes)</h3><p class="mu" style="margin-bottom:10px">Track gently — gradual change is the goal.</p>${HAB.map(x=>`<div class="row"><span style="width:130px">${x[1]} ${x[2]}</span><input id="h_${x[0]}" type="number" inputmode="numeric" min="0" value="${h[x[0]]||''}" placeholder="0" style="margin:0 0 8px"></div>`).join('')}<button class="p big" onclick="saveHabits()">Save today</button>
<p class="mu" style="margin-top:10px">7-day averages: ${HAB.map(x=>x[1]+' '+avg(x[0],0,7)+'m').join(' · ')}.</p><p style="margin-top:6px">${g1<g0?'🌟 Gaming time is lower than last week — lovely progress!':'Balanced gaming is fine. Even a small walk or reading break helps.'}</p></div>
<h3 style="margin:4px 0 10px">Achievements</h3><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">${BADGES.map(b=>`<div class="badge ${b[2](P)?'':'lock'}"><span>${b[0]}</span>${b[1]}</div>`).join('')}</div>
<div class="card"><h3>Profile</h3><p class="mu" style="margin:4px 0 8px">${esc(P.email||'Guest (saved on this device)')}</p><input id="nm" value="${esc(P.name)}"><button onclick="rename()" style="width:100%">Save name</button></div>`}
/* admin */
const cT=()=>tests.find(t=>t.id==adm.tid)||tests[0];
async function wT(t){try{await db.collection('tests').doc(t.id).set({title:t.title,order:t.order||0,questions:t.questions});await loadTests();render();toast('Saved')}catch(e){toast('Save failed')}}
function newTest(){const v=$('#nt').value.trim()||'Week '+(tests.length+1)+' Test';const t={id:'t'+Date.now(),title:v,order:tests.filter(x=>x.id!='starter').length+1,questions:[]};adm.tid=t.id;db.collection('tests').doc(t.id).set({title:t.title,order:t.order,questions:[]}).then(async()=>{await loadTests();render()}).catch(()=>toast('Failed'))}
function sQ(){const t=cT(),q={s:$('#qs').value,q:$('#qq').value.trim(),o:[0,1,2,3].map(i=>$('#o'+i).value.trim()),a:+$('#qa').value};if(!q.q||q.o.some(x=>!x))return toast('Fill in the question and all 4 options');const n=structuredClone(t);if(adm.edit==null||adm.edit<0)n.questions.push(q);else n.questions[adm.edit]=q;adm.edit=null;wT(n)}
function dQ(i){const n=structuredClone(cT());n.questions.splice(i,1);wT(n)}
async function users(){adm.tab='u';render();try{const q=await db.collection('users').get();adm.users=q.docs.map(d=>d.data());}catch(e){adm.users=[];toast('Could not load users')}render()}
function admin(){const t=cT(),e=adm.edit!=null&&adm.edit>=0?t.questions[adm.edit]:{s:'General Knowledge',q:'',o:['','','',''],a:0};
const head=`<h2>Admin</h2><div class="row" style="margin:12px 0"><button class="${adm.tab=='q'?'on':''}" onclick="adm.tab='q';render()" style="flex:1">Questions</button><button class="${adm.tab=='u'?'on':''}" onclick="users()" style="flex:1">Users</button></div>`;
if(adm.tab=='u'){const u=adm.users;if(!u)return head+'<p class="mu">Loading…</p>';const all=u.flatMap(x=>x.results||[]),av=all.length?Math.round(all.reduce((a,r)=>a+r.pct,0)/all.length):0;
return head+`<div class="grid" style="margin-bottom:14px"><div class="stat"><b>${u.length}</b>Users</div><div class="stat"><b>${av}%</b>Avg test score</div></div><div class="card">${u.map(x=>`<div class="item"><b>${esc(x.name)}</b> <span class="mu">${esc(x.email||'')}</span><br><span class="mu">${(x.results||[]).length} tests · ${x.pts||0} pts · ${x.streak||0}-wk streak · last: ${(x.results||[]).length?x.results.at(-1).pts+' pts':'—'}</span></div>`).join('')||'<p class="mu">No users yet.</p>'}</div>`}
return head+`<div class="card"><div class="row wrap">${tests.map(x=>`<button class="${x.id==t.id?'on':''}" onclick="adm.tid='${x.id}';adm.edit=null;render()">${esc(x.title)}</button>`).join('')}</div><div class="row" style="margin-top:10px"><input id="nt" placeholder="New weekly test title" style="margin:0"><button class="p" onclick="newTest()">Create</button></div></div>
${t.id=='starter'?`<div class="card"><p class="mu" style="margin-bottom:8px">This is the built-in starter test. Save it to the database to edit it.</p><button class="p big" onclick="db.collection('tests').doc('starter').set({title:STARTER.title,order:0,questions:STARTER.questions}).then(async()=>{await loadTests();render()})">Save starter test</button></div>`:`<div class="card"><h3>${esc(t.title)} · ${t.questions.length} questions</h3>${t.questions.map((q,i)=>`<div class="item"><span class="mu">${esc(q.s)}</span><br>${esc(q.q)}<br><span class="mu">✔ ${esc(q.o[q.a])}</span><div class="row" style="margin-top:6px"><button onclick="adm.edit=${i};render()">Edit</button><button onclick="dQ(${i})">Delete</button></div></div>`).join('')}</div>
<div class="card"><h3>${adm.edit!=null&&adm.edit>=0?'Edit question':'Add question'}</h3><select id="qs">${['General Knowledge','Science','Technology','Computer Science','English','Mathematics','Current Affairs','Logical Reasoning'].map(s=>`<option ${s==e.s?'selected':''}>${s}</option>`).join('')}</select><input id="qq" placeholder="Question" value="${esc(e.q)}">${[0,1,2,3].map(i=>`<input id="o${i}" placeholder="Option ${i+1}" value="${esc(e.o[i])}">`).join('')}<select id="qa">${[0,1,2,3].map(i=>`<option value="${i}" ${i==e.a?'selected':''}>Correct: option ${i+1}</option>`).join('')}</select><button class="p big" onclick="sQ()">Save question</button></div>`}`}
function render(){const a=$('#app'),n=$('#nav');
if(view=='login'){n.hidden=true;a.innerHTML=`<div class="center"><div style="font-size:80px">🌱</div><h2 style="font-size:32px">Game-Free Growth</h2><p class="mu" style="font-size:17px">One small test a week. One small step at a time.</p><button class="p big" onclick="enter()">${me?'Continue as '+esc(me.name||'my account'):'Continue as guest'}</button><p class="mu">${db?'Signed in with your claude.ai account — your progress syncs across devices.':'Guest mode — progress is saved on this device only.'}</p></div>`;return}
if(view=='saving'){n.hidden=true;a.innerHTML='<div class="center"><h2>Saving your score…</h2></div>';return}
